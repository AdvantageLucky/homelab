services:
  navidrome:
    image: deluan/navidrome:latest
    user: 1000:1000
    ports:
      - "127.0.0.1:4533:4533"
      - "${TAILSCALE_IP}:4533:4533"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ND_DEFAULTLANGUAGE: es
      ND_LASTFM_LANGUAGE: es
      ND_LASTFM_SCROBBLEFIRSTARTISTONLY: "true"
      ND_SUBSONIC_ARTISTPARTICIPATIONS: "true"
    volumes:
      - "./data:/data"
      - "${HOME}/music:/music:ro"
