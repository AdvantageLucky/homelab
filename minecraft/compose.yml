services:
  lazymc:
    image: ghcr.io/joesturge/lazymc-docker-proxy:latest
    container_name: lazymc
    restart: unless-stopped
    ports:
      - "127.0.0.1:25565:25565"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homelab

  mc:
    image: itzg/minecraft-server
    container_name: minecraft
    restart: "no"
    labels:
      - lazymc.enabled=true
      - lazymc.group=mc
      - lazymc.server.address=minecraft:25565
      - lazymc.time.sleep_after=300  # seconds (5 minutes)
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "LATEST"
      MEMORY: "3G"
      USE_AIKAR_FLAGS: "TRUE"

      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"

      MOTD: "Server de casa"
      DIFFICULTY: "hard"
    volumes:
      - ./data:/data
    networks:
      - homelab

  mc-health:
    image: python:3.13-alpine
    container_name: mc-health
    restart: unless-stopped
    networks:
      - homelab
    command:
      - python
      - -c
      - |
        import socket, http.server
        class H(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
                try:
                    socket.create_connection(("lazymc", 25565), timeout=3).close()
                    code = 200
                except OSError:
                    code = 503
                self.send_response(code)
                self.end_headers()
            def log_message(self, *args):
                pass
        http.server.HTTPServer(("", 7000), H).serve_forever()

networks:
  homelab:
    external: true
