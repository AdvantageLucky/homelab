services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17
    container_name: forgejo
    labels:
      - "glance.name=Forgejo"
      - "glance.icon=si:forgejo"
      - "glance.description=Git self-hosted server"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8040:3000"
    env_file: .env
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__server__ROOT_URL=${ROOT_URL}
      - FORGEJO__server__DISABLE_SSH=true
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - homelab

networks:
  homelab:
    external: true
