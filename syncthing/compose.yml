services:
  syncthing:
    container_name: syncthing
    image: syncthing/syncthing
    ports:
      - "127.0.0.1:8384:8384"
      - "${TAILSCALE_IP}:22000:22000/tcp"
      - "${TAILSCALE_IP}:22000:22000/udp"
      - "${TAILSCALE_IP}:21027:21027/udp"
    restart: unless-stopped
    healthcheck:
      test: curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o --color=never OK || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
    environment:
      PUID: 1000
      PGID: 1000
      STGUIADDRESS: "0.0.0.0:8384"
    env_file:
      - .env
    volumes:
      - "./config:/config"
      - "${HOME}/${SYNCTHING_PATH}:/data1"
    networks:
      - homelab

networks:
  homelab:
    external: true
