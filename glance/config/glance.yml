theme:
  background-color: 240 21 15
  contrast-multiplier: 1.2
  primary-color: 217 92 83
  positive-color: 115 54 76
  negative-color: 347 70 65

pages:
  - name: MiniLaika 
    hide-desktop-navigation: true
    show-mobile-header: true

    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 12h

          - type: server-stats
            servers:
              - type: local
                hide-mountpoints-by-default: true
                mountpoints:
                  "/":
                    name: Root
                    hide: false
                  ${DISK_PATH}:
                    name: HGST
                    hide: false

                name: MiniLaika
                hide-swap: true

          - type: custom-api
            title: Weather Forecast
            cache: 1h
            url: https://api.open-meteo.com/v1/forecast?latitude=19.22&longitude=-98.23&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=America%2FMexico_City
            template: |
              <div class="flex justify-between text-center">
              {{ range $i, $d := .JSON.Array "daily.time" }}
                {{ $max := $.JSON.Float (printf "daily.temperature_2m_max.%d" $i) }}
                {{ $min := $.JSON.Float (printf "daily.temperature_2m_min.%d" $i) }}
                {{ $code := $.JSON.Int (printf "daily.weather_code.%d" $i) }}
                <div>
                  <div class="size-h6">{{ printf "%.3s" (parseTime "DateOnly" ($.JSON.String (printf "daily.time.%d" $i))).Weekday.String }}</div>
                  <div>{{ if ge $code 71 }}❄️{{ else if ge $code 51 }}🌧️{{ else if ge $code 2 }}☁️{{ else }}☀️{{ end }}</div>
                  <div class="color-highlight">{{ printf "%.0f" $max }}°</div>
                  <div>{{ printf "%.0f" $min }}°</div>
                </div>
              {{ end }}
              </div>

          - type: custom-api
            title: Last.fm
            cache: 5m
            url: https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${LASTFM_USER}&api_key=${LASTFM_API_KEY}&format=json&limit=8
            template: |
              <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
                {{ range .JSON.Array "recenttracks.track" }}
                <li>
                  <a class="size-h4 color-highlight block text-truncate" href="{{ .String "url" }}" target="_blank" rel="noreferrer">{{ .String "name" }}</a>
                  <div class="text-truncate">{{ .String "artist.#text" }}</div>
                </li>
                {{ end }}
              </ul>

      - size: full
        widgets:
          - type: search
            title: Buscador
            search-engine: google
            autofocus: true
            placeholder: Escribe aqui para buscar...

          - type: monitor
            title: Servicios
            cache: 1m
            sites:
              - title: Navidrome
                url: ${TAILSCALE_HOST}:${NAVIDROME_EXT_PORT}
                check-url: http://navidrome:${NAVIDROME_INT_PORT}
                icon: di:navidrome
              - title: Frigate
                url: ${TAILSCALE_HOST}:${FRIGATE_EXT_PORT}
                check-url: https://frigate:${FRIGATE_INT_PORT}
                allow-insecure: true
                icon: di:frigate
              - title: Calibre Web Automated
                url: ${TAILSCALE_HOST}:${CALIBRE_EXT_PORT}
                check-url: http://calibre-web-automated:${CALIBRE_INT_PORT}
                icon: di:calibre
              - title: Photoview
                url: ${TAILSCALE_HOST}:${PHOTOVIEW_EXT_PORT}
                check-url: http://photoview:${PHOTOVIEW_INT_PORT}
                icon: di:photoview
              - title: Syncthing
                url: ${TAILSCALE_HOST}:${SYNCTHING_EXT_PORT}
                check-url: http://syncthing:${SYNCTHING_INT_PORT}
                icon: di:syncthing
              - title: Vaultwarden
                url: ${TAILSCALE_HOST}:${VAULTWARDEN_EXT_PORT}
                check-url: http://vaultwarden:${VAULTWARDEN_INT_PORT}/alive
                icon: di:vaultwarden
              - title: Forgejo
                url: ${TAILSCALE_HOST}:${FORGEJO_EXT_PORT}
                check-url: http://forgejo:${FORGEJO_INT_PORT}/api/healthz
                icon: di:forgejo
              - title: Uptime Kuma
                url: ${TAILSCALE_HOST}:${UPTIME_KUMA_EXT_PORT}
                check-url: http://uptime-kuma:${UPTIME_KUMA_INT_PORT}
                icon: di:uptime-kuma 

          - type: docker-containers
            hide-by-default: false
            sort-by: state

          - type: rss
            title: Noticias
            limit: 12
            collapse-after: 6
            cache: 2h
            feeds:
              - url: https://archlinux.org/feeds/news/
                title: Arch Linux
              - url: https://selfh.st/rss/
                title: selfh.st
              - url: https://lwn.net/headlines/rss
                title: LWN

      - size: small
        widgets:
          - type: custom-api
            title: Tailscale
            cache: 10m
            url: https://api.tailscale.com/api/v2/tailnet/-/devices
            headers:
              Authorization: Bearer ${TAILSCALE_API_KEY}
            template: |
              <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
                {{ range .JSON.Array "devices" }}
                <li class="flex items-center gap-10">
                  <span class="{{ if .Bool "online" }}color-positive{{ else }}color-negative{{ end }}">●</span>
                  <span class="text-truncate">{{ .String "hostname" }}</span>
                </li>
                {{ end }}
              </ul>

          - type: custom-api
            title: Frigate
            url: ${FRIGATE_URL} 
            allow-insecure: true
            skip-tls-verify: true
            cache: 30s
            template: |
              <div style="padding: 1rem;">
                <ul style="list-style: none; padding: 0; margin: 0; gap: 10px;">
                  <li>
                    <div style="padding-bottom: 1rem;">
                      <a style="color: var(--color-primary); font-weight: bold; text-decoration: none;" href="${FRIGATE_URL_EXT}" target="_blank" rel="noreferrer" title="Frigate Dashboard">Last 24 Hours Activity</a>
                    </div>
                    <ul style="list-style: none; padding: 0; margin: 0; gap: 10px;">
                      <li style="display: flex; gap: 1rem; margin-bottom: 8px;">
                        <span style="color: var(--color-negative); font-weight: 500;">Alerts:</span>
                        <span style="color: var(--color-text-base);">{{ .JSON.Int "last24Hours.total_alert" }}</span>
                      </li>
                      <li style="display: flex; gap: 1rem;">
                        <span style="color: var(--color-negative); font-weight: 500;">Detections:</span>
                        <span style="color: var(--color-text-base);">{{ .JSON.Int "last24Hours.total_detection" }}</span>
                      </li>
                    </ul>
                  </li>
                </ul>
              </div>

          - type: custom-api
            title: Servicios (Kuma)
            cache: 1m
            url: http://uptime-kuma:3001/api/status-page/homelab
            subrequests:
              hb:
                url: http://uptime-kuma:3001/api/status-page/heartbeat/homelab
            template: |
              {{ $hb := .Subrequest "hb" }}{{ $newest := "" }}
              <ul class="list list-gap-10">
              {{ range .JSON.Array "publicGroupList.0.monitorList" }}{{ if ne (.String "type") "group" }}
                {{ $id := .Int "id" }}{{ $name := .String "name" }}{{ $url := "${TAILSCALE_HOST}:8070/status/homelab" }}{{ if eq $name "Navidrome" }}{{ $url = "${TAILSCALE_HOST}" }}{{ else if eq $name "Vaultwarden" }}{{ $url = "${TAILSCALE_HOST}:${VAULTWARDEN_EXT_PORT}" }}{{ else if eq $name "Syncthing" }}{{ $url = "${TAILSCALE_HOST}:${SYNCTHING_EXT_PORT}" }}{{ else if eq $name "Photoview" }}{{ $url = "${TAILSCALE_HOST}:${PHOTOVIEW_EXT_PORT}" }}{{ else if eq $name "Forgejo" }}{{ $url = "${TAILSCALE_HOST}:${FORGEJO_EXT_PORT}" }}{{ else if eq $name "Calibre Web Automated" }}{{ $url = "${TAILSCALE_HOST}:${CALIBRE_EXT_PORT}" }}{{ else if or (eq $name "Frigate") (eq $name "Frigate Casa Bolillo Techo") }}{{ $url = "${TAILSCALE_HOST}:${FRIGATE_EXT_PORT}" }}{{ else if eq $name "Glance" }}{{ $url = "${TAILSCALE_HOST}:8080" }}{{ end }}{{ $beats := $hb.JSON.Array (printf "heartbeatList.%d" $id) }}{{ $ping := 0 }}
                <li>
                  <a href="{{ $url }}" target="_blank" rel="noreferrer" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;">
                    <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ $name }}</span>
                    <div style="display:flex;justify-content:flex-end;overflow:hidden;width:90px;height:14px;gap:2px;">
                      {{ range $beats }}{{ $s := .Int "status" }}<span style="flex:0 0 3px;height:100%;border-radius:1px;background:{{ if eq $s 1 }}var(--color-positive){{ else if eq $s 0 }}var(--color-negative){{ else }}var(--color-warning){{ end }};"></span>{{ $ping = .Int "ping" }}{{ $t := .String "time" }}{{ if gt $t $newest }}{{ $newest = $t }}{{ end }}{{ end }}
                    </div>
                    <span class="color-subdue" style="width:44px;text-align:right;">{{ if gt $ping 999 }}{{ printf "%.0fs" (div (toFloat $ping) 1000.0) }}{{ else if gt $ping 0 }}{{ $ping }}ms{{ else }}-{{ end }}</span>
                    <span style="width:54px;text-align:right;">{{ printf "%.1f" (mul ($hb.JSON.Float (printf "uptimeList.%d_24" $id)) 100.0) }}%</span>
                  </a>
                </li>
              {{ end }}{{ end }}
              </ul>
              <p class="size-h6 color-subdue" style="margin-top:10px;">newest beat {{ $newest }} UTC</p>

          - type: custom-api
            title: Backups (Kuma)
            cache: 1m
            url: http://uptime-kuma:3001/api/status-page/homelab
            subrequests:
              hb:
                url: http://uptime-kuma:3001/api/status-page/heartbeat/homelab
            template: |
              {{ $hb := .Subrequest "hb" }}{{ $newest := "" }}
              <ul class="list list-gap-10">
              {{ range .JSON.Array "publicGroupList.1.monitorList" }}{{ if ne (.String "type") "group" }}
                {{ $id := .Int "id" }}{{ $name := .String "name" }}{{ $url := "${TAILSCALE_HOST}:8070/status/homelab" }}{{ if eq $name "Navidrome" }}{{ $url = "${TAILSCALE_HOST}" }}{{ else if eq $name "Vaultwarden" }}{{ $url = "${TAILSCALE_HOST}:${VAULTWARDEN_EXT_PORT}" }}{{ else if eq $name "Syncthing" }}{{ $url = "${TAILSCALE_HOST}:${SYNCTHING_EXT_PORT}" }}{{ else if eq $name "Photoview" }}{{ $url = "${TAILSCALE_HOST}:${PHOTOVIEW_EXT_PORT}" }}{{ else if eq $name "Forgejo" }}{{ $url = "${TAILSCALE_HOST}:${FORGEJO_EXT_PORT}" }}{{ else if eq $name "Calibre Web Automated" }}{{ $url = "${TAILSCALE_HOST}:${CALIBRE_EXT_PORT}" }}{{ else if or (eq $name "Frigate") (eq $name "Frigate Casa Bolillo Techo") }}{{ $url = "${TAILSCALE_HOST}:${FRIGATE_EXT_PORT}" }}{{ else if eq $name "Glance" }}{{ $url = "${TAILSCALE_HOST}:8080" }}{{ end }}{{ $beats := $hb.JSON.Array (printf "heartbeatList.%d" $id) }}{{ $ping := 0 }}
                <li>
                  <a href="{{ $url }}" target="_blank" rel="noreferrer" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;">
                    <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ $name }}</span>
                    <div style="display:flex;justify-content:flex-end;overflow:hidden;width:90px;height:14px;gap:2px;">
                      {{ range $beats }}{{ $s := .Int "status" }}<span style="flex:0 0 3px;height:100%;border-radius:1px;background:{{ if eq $s 1 }}var(--color-positive){{ else if eq $s 0 }}var(--color-negative){{ else }}var(--color-warning){{ end }};"></span>{{ $ping = .Int "ping" }}{{ $t := .String "time" }}{{ if gt $t $newest }}{{ $newest = $t }}{{ end }}{{ end }}
                    </div>
                    <span class="color-subdue" style="width:44px;text-align:right;">{{ if gt $ping 999 }}{{ printf "%.0fs" (div (toFloat $ping) 1000.0) }}{{ else if gt $ping 0 }}{{ $ping }}ms{{ else }}-{{ end }}</span>
                    <span style="width:54px;text-align:right;">{{ printf "%.1f" (mul ($hb.JSON.Float (printf "uptimeList.%d_24" $id)) 100.0) }}%</span>
                  </a>
                </li>
              {{ end }}{{ end }}
              </ul>
              <p class="size-h6 color-subdue" style="margin-top:10px;">newest beat {{ $newest }} UTC</p>

          - type: custom-api
            title: Mantenimiento (Kuma)
            cache: 1m
            url: http://uptime-kuma:3001/api/status-page/homelab
            subrequests:
              hb:
                url: http://uptime-kuma:3001/api/status-page/heartbeat/homelab
            template: |
              {{ $hb := .Subrequest "hb" }}{{ $newest := "" }}
              <ul class="list list-gap-10">
              {{ range .JSON.Array "publicGroupList.2.monitorList" }}{{ if ne (.String "type") "group" }}
                {{ $id := .Int "id" }}{{ $name := .String "name" }}{{ $url := "${TAILSCALE_HOST}:8070/status/homelab" }}{{ if eq $name "Navidrome" }}{{ $url = "${TAILSCALE_HOST}" }}{{ else if eq $name "Vaultwarden" }}{{ $url = "${TAILSCALE_HOST}:${VAULTWARDEN_EXT_PORT}" }}{{ else if eq $name "Syncthing" }}{{ $url = "${TAILSCALE_HOST}:${SYNCTHING_EXT_PORT}" }}{{ else if eq $name "Photoview" }}{{ $url = "${TAILSCALE_HOST}:${PHOTOVIEW_EXT_PORT}" }}{{ else if eq $name "Forgejo" }}{{ $url = "${TAILSCALE_HOST}:${FORGEJO_EXT_PORT}" }}{{ else if eq $name "Calibre Web Automated" }}{{ $url = "${TAILSCALE_HOST}:${CALIBRE_EXT_PORT}" }}{{ else if or (eq $name "Frigate") (eq $name "Frigate Casa Bolillo Techo") }}{{ $url = "${TAILSCALE_HOST}:${FRIGATE_EXT_PORT}" }}{{ else if eq $name "Glance" }}{{ $url = "${TAILSCALE_HOST}:8080" }}{{ end }}{{ $beats := $hb.JSON.Array (printf "heartbeatList.%d" $id) }}{{ $ping := 0 }}
                <li>
                  <a href="{{ $url }}" target="_blank" rel="noreferrer" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;">
                    <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ $name }}</span>
                    <div style="display:flex;justify-content:flex-end;overflow:hidden;width:90px;height:14px;gap:2px;">
                      {{ range $beats }}{{ $s := .Int "status" }}<span style="flex:0 0 3px;height:100%;border-radius:1px;background:{{ if eq $s 1 }}var(--color-positive){{ else if eq $s 0 }}var(--color-negative){{ else }}var(--color-warning){{ end }};"></span>{{ $ping = .Int "ping" }}{{ $t := .String "time" }}{{ if gt $t $newest }}{{ $newest = $t }}{{ end }}{{ end }}
                    </div>
                    <span class="color-subdue" style="width:44px;text-align:right;">{{ if gt $ping 999 }}{{ printf "%.0fs" (div (toFloat $ping) 1000.0) }}{{ else if gt $ping 0 }}{{ $ping }}ms{{ else }}-{{ end }}</span>
                    <span style="width:54px;text-align:right;">{{ printf "%.1f" (mul ($hb.JSON.Float (printf "uptimeList.%d_24" $id)) 100.0) }}%</span>
                  </a>
                </li>
              {{ end }}{{ end }}
              </ul>
              <p class="size-h6 color-subdue" style="margin-top:10px;">newest beat {{ $newest }} UTC</p>


