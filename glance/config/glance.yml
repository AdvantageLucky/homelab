theme:
  background-color: 240 21 15
  contrast-multiplier: 1.2
  primary-color: 217 92 83
  positive-color: 115 54 76
  negative-color: 347 70 65

pages:
  - name: MiniLaika 
    hide-desktop-navigation: true
    show-mobile-header: true

    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 12h

          - type: server-stats
            servers:
              - type: local
                hide-mountpoints-by-default: true
                mountpoints:
                  "/":
                    name: Root
                    hide: false

                name: MiniLaika
                hide-swap: true

          - type: custom-api
            title: Weather Forecast
            cache: 1h
            url: https://api.open-meteo.com/v1/forecast?latitude=19.22&longitude=-98.23&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=America%2FMexico_City
            template: |
              <div class="flex justify-between text-center">
              {{ range $i, $d := .JSON.Array "daily.time" }}
                {{ $max := $.JSON.Float (printf "daily.temperature_2m_max.%d" $i) }}
                {{ $min := $.JSON.Float (printf "daily.temperature_2m_min.%d" $i) }}
                {{ $code := $.JSON.Int (printf "daily.weather_code.%d" $i) }}
                <div>
                  <div class="size-h6">{{ printf "%.3s" (parseTime "DateOnly" ($.JSON.String (printf "daily.time.%d" $i))).Weekday.String }}</div>
                  <div>{{ if ge $code 71 }}❄️{{ else if ge $code 51 }}🌧️{{ else if ge $code 2 }}☁️{{ else }}☀️{{ end }}</div>
                  <div class="color-highlight">{{ printf "%.0f" $max }}°</div>
                  <div>{{ printf "%.0f" $min }}°</div>
                </div>
              {{ end }}
              </div>

          - type: custom-api
            title: Last.fm
            cache: 5m
            url: https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${LASTFM_USER}&api_key=${LASTFM_API_KEY}&format=json&limit=8
            template: |
              <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
                {{ range .JSON.Array "recenttracks.track" }}
                <li>
                  <a class="size-h4 color-highlight block text-truncate" href="{{ .String "url" }}" target="_blank" rel="noreferrer">{{ .String "name" }}</a>
                  <div class="text-truncate">{{ .String "artist.#text" }}</div>
                </li>
                {{ end }}
              </ul>

      - size: full
        widgets:
          - type: search
            title: Buscador
            search-engine: google
            autofocus: true
            placeholder: Escribe aqui para buscar...

          - type: monitor
            title: Servicios
            cache: 1m
            sites:
              - title: Navidrome
                url: ${TAILSCALE_HOST}:${NAVIDROME_EXT_PORT}
                check-url: http://navidrome:${NAVIDROME_INT_PORT}
                icon: di:navidrome
              - title: Photoview
                url: ${TAILSCALE_HOST}:${PHOTOVIEW_EXT_PORT}
                check-url: http://photoview:${PHOTOVIEW_INT_PORT}
                icon: di:photoview
              - title: Syncthing
                url: ${TAILSCALE_HOST}:${SYNCTHING_EXT_PORT}
                check-url: http://syncthing:${SYNCTHING_INT_PORT}
                icon: di:syncthing
              - title: Vaultwarden
                url: ${TAILSCALE_HOST}:${VAULTWARDEN_EXT_PORT}
                check-url: http://vaultwarden:${VAULTWARDEN_INT_PORT}/alive
                icon: di:vaultwarden
              - title: Forgejo
                url: ${TAILSCALE_HOST}:${FORGEJO_EXT_PORT}
                check-url: http://forgejo:${FORGEJO_INT_PORT}/api/healthz
                icon: di:forgejo

          - type: docker-containers
            hide-by-default: false
            sort-by: state

          - type: rss
            title: Noticias
            limit: 12
            collapse-after: 6
            cache: 2h
            feeds:
              - url: https://archlinux.org/feeds/news/
                title: Arch Linux
              - url: https://selfh.st/rss/
                title: selfh.st
              - url: https://lwn.net/headlines/rss
                title: LWN

      - size: small
        widgets:
          - type: custom-api
            title: Tailscale
            cache: 10m
            url: https://api.tailscale.com/api/v2/tailnet/-/devices
            headers:
              Authorization: Bearer ${TAILSCALE_API_KEY}
            template: |
              <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
                {{ range .JSON.Array "devices" }}
                <li class="flex items-center gap-10">
                  <span class="{{ if .Bool "online" }}color-positive{{ else }}color-negative{{ end }}">●</span>
                  <span class="text-truncate">{{ .String "hostname" }}</span>
                </li>
                {{ end }}
              </ul>

          - type: custom-api
            title: xkcd
            cache: 2m
            url: https://xkcd.com/info.0.json
            template: |
              <body> {{ .JSON.String "title" }}</body>
              <img src="{{ .JSON.String "img" }}"></img>

          - type: hacker-news
            limit: 15
            collapse-after: 6

